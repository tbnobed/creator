services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-obtv}
      POSTGRES_USER: ${POSTGRES_USER:-obtv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - obtv_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  prompt-ai:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODEL: ${PROMPT_AI_MODEL:-qwen2.5:1.5b}
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_CONTEXT_LENGTH: 2048
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama serve & server_pid=$$!; trap 'kill $$server_pid; wait $$server_pid' TERM INT; until OLLAMA_HOST=127.0.0.1:11434 ollama list >/dev/null 2>&1; do sleep 2; done; until OLLAMA_HOST=127.0.0.1:11434 ollama pull \"$$OLLAMA_MODEL\"; do echo \"Model pull failed; retrying in 15 seconds\"; sleep 15; done; wait $$server_pid"
    cpus: "2.0"
    volumes:
      - obtv_prompt_ai_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=127.0.0.1:11434 ollama list | grep -q \"$$OLLAMA_MODEL\""]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: deployment/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-obtv}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-obtv}
      OBTV_MEDIA_ROOT: /var/lib/obtv-media
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PROMPT_AI_BASE_URL: http://prompt-ai:11434
      PROMPT_AI_MODEL: ${PROMPT_AI_MODEL:-qwen2.5:1.5b}
      NO_PROXY: prompt-ai,db,127.0.0.1,localhost
      no_proxy: prompt-ai,db,127.0.0.1,localhost
      COMFY_ALLOWED_HOSTS: ${COMFY_ALLOWED_HOSTS:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      OBTV_SEED_A100_NAME: ${OBTV_SEED_A100_NAME:-PN A100}
      OBTV_SEED_A100_API_URL: ${OBTV_SEED_A100_API_URL:-}
      OBTV_SEED_A100_WEBSOCKET_URL: ${OBTV_SEED_A100_WEBSOCKET_URL:-}
      OBTV_SEED_A100_ENABLED: ${OBTV_SEED_A100_ENABLED:-true}
      OBTV_SEED_A100_PRIORITY: ${OBTV_SEED_A100_PRIORITY:-5}
      OBTV_SEED_A100_MAX_CONCURRENT_JOBS: ${OBTV_SEED_A100_MAX_CONCURRENT_JOBS:-}
      OBTV_SEED_BLACKWELL_NAME: ${OBTV_SEED_BLACKWELL_NAME:-GB10_Asus}
      OBTV_SEED_BLACKWELL_API_URL: ${OBTV_SEED_BLACKWELL_API_URL:-}
      OBTV_SEED_BLACKWELL_WEBSOCKET_URL: ${OBTV_SEED_BLACKWELL_WEBSOCKET_URL:-}
      OBTV_SEED_BLACKWELL_ENABLED: ${OBTV_SEED_BLACKWELL_ENABLED:-true}
      OBTV_SEED_BLACKWELL_PRIORITY: ${OBTV_SEED_BLACKWELL_PRIORITY:-10}
      OBTV_SEED_BLACKWELL_MAX_CONCURRENT_JOBS: ${OBTV_SEED_BLACKWELL_MAX_CONCURRENT_JOBS:-}
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"
    volumes:
      - obtv_media_data:/var/lib/obtv-media
    depends_on:
      db:
        condition: service_healthy
      prompt-ai:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5000/api/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: deployment/Dockerfile.web
      args:
        BASE_PATH: /
    restart: unless-stopped
    environment:
      API_PROXY_ORIGIN: http://api:5000
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"

volumes:
  obtv_postgres_data:
  obtv_media_data:
  obtv_prompt_ai_data: