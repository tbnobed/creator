openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: characters
    description: Character library
  - name: settings
    description: Setting library
  - name: servers
    description: ComfyUI server administration
  - name: workflows
    description: Workflow template administration
  - name: generations
    description: Video generation jobs
  - name: long-form-projects
    description: Long-form video planning and orchestration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /characters:
    get:
      operationId: listCharacters
      tags: [characters]
      summary: List characters
      responses:
        "200":
          description: Character library
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Character"
    post:
      operationId: createCharacter
      tags: [characters]
      summary: Create a character
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterInput"
      responses:
        "201":
          description: Created character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
  /characters/{id}:
    patch:
      operationId: updateCharacter
      tags: [characters]
      summary: Update a character
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterInput"
      responses:
        "200":
          description: Updated character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
    delete:
      operationId: deleteCharacter
      tags: [characters]
      summary: Delete a character
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
  /settings:
    get:
      operationId: listSettings
      tags: [settings]
      summary: List settings
      responses:
        "200":
          description: Setting library
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Setting"
    post:
      operationId: createSetting
      tags: [settings]
      summary: Create a setting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingInput"
      responses:
        "201":
          description: Created setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
  /settings/{id}:
    patch:
      operationId: updateSetting
      tags: [settings]
      summary: Update a setting
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingInput"
      responses:
        "200":
          description: Updated setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
    delete:
      operationId: deleteSetting
      tags: [settings]
      summary: Delete a setting
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
  /servers:
    get:
      operationId: listServers
      tags: [servers]
      summary: List configured ComfyUI servers
      responses:
        "200":
          description: Server cards without private connection details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComfyServer"
    post:
      operationId: createServer
      tags: [servers]
      summary: Add a ComfyUI server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerCreateInput"
      responses:
        "201":
          description: Created server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComfyServer"
  /servers/{id}:
    patch:
      operationId: updateServer
      tags: [servers]
      summary: Update a ComfyUI server
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerUpdateInput"
      responses:
        "200":
          description: Updated server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComfyServer"
    delete:
      operationId: deleteServer
      tags: [servers]
      summary: Remove a server
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
  /servers/{id}/configuration:
    get:
      operationId: getServerConfiguration
      tags: [servers]
      summary: Read saved ComfyUI connection details for editing
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Editable ComfyUI connection configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerConnectionConfiguration"
  /servers/{id}/test:
    post:
      operationId: testServerConnection
      tags: [servers]
      summary: Test a configured server connection
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Connection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTest"
  /servers/{id}/queue:
    get:
      operationId: getServerQueue
      tags: [servers]
      summary: Read the queue for a configured server
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Queue snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueSnapshot"
  /workflows:
    get:
      operationId: listWorkflows
      tags: [workflows]
      summary: List workflow templates
      responses:
        "200":
          description: Workflow templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowTemplate"
    post:
      operationId: createWorkflow
      tags: [workflows]
      summary: Import an API-format workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowInput"
      responses:
        "201":
          description: Imported workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowTemplate"
  /workflows/{id}:
    get:
      operationId: getWorkflow
      tags: [workflows]
      summary: Inspect a workflow template
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Workflow with readable node inspection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowTemplate"
    patch:
      operationId: updateWorkflow
      tags: [workflows]
      summary: Update workflow metadata, API JSON, and mappings
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowUpdate"
      responses:
        "200":
          description: Updated workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowTemplate"
  /generations:
    get:
      operationId: listGenerations
      tags: [generations]
      summary: List generation history
      parameters:
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        "200":
          description: Paginated generation history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedGenerations"
    post:
      operationId: createGeneration
      tags: [generations]
      summary: Submit a generation job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerationInput"
      responses:
        "201":
          description: Queued generation job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"
  /generations/{id}:
    get:
      operationId: getGeneration
      tags: [generations]
      summary: Get a generation job
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Generation job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"
    delete:
      operationId: deleteGeneration
      tags: [generations]
      summary: Delete a completed generation from history
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
        "404":
          description: Generation not found
        "409":
          description: Active generations must be cancelled before deletion
  /generations/{id}/cancel:
    post:
      operationId: cancelGeneration
      tags: [generations]
      summary: Cancel an active generation job
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Cancelled generation job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"
  /reference-videos:
    get:
      operationId: listReferenceVideos
      tags: [media]
      summary: List previously uploaded reference videos
      responses:
        "200":
          description: Reference video library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceVideoList"
    post:
      operationId: uploadReferenceVideo
      tags: [media]
      summary: Upload a reference video for a generation
      requestBody:
        required: true
        content:
          video/mp4:
            schema:
              type: string
              format: binary
          video/webm:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Stored reference video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceVideoUpload"
  /reference-videos/{name}:
    delete:
      operationId: deleteReferenceVideo
      tags: [media]
      summary: Delete a previously uploaded reference video
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Reference video deleted
  /prompt-guidance/polish:
    post:
      operationId: polishPrompt
      tags: [generations]
      summary: Improve a video prompt while preserving creator intent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptPolishInput"
      responses:
        "200":
          description: Editable polished prompt fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptPolishResult"
  /prompt-guidance/check:
    post:
      operationId: checkPrompt
      tags: [generations]
      summary: Review the current video prompt with AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptPolishInput"
      responses:
        "200":
          description: AI prompt review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptCheckResult"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [generations]
      summary: Read studio summary data
      responses:
        "200":
          description: Summary for the studio shell
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /long-form-projects:
    get:
      operationId: listLongFormProjects
      tags: [long-form-projects]
      summary: List long-form video projects
      responses:
        "200":
          description: Long-form projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LongFormProject"
    post:
      operationId: createLongFormProject
      tags: [long-form-projects]
      summary: Create a planned long-form video project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LongFormProjectInput"
      responses:
        "201":
          description: Planned long-form project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LongFormProjectDetail"
  /long-form-projects/{id}:
    get:
      operationId: getLongFormProject
      tags: [long-form-projects]
      summary: Get a long-form project and its shot plan
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Long-form project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LongFormProjectDetail"
    delete:
      operationId: deleteLongFormProject
      tags: [long-form-projects]
      summary: Delete a non-active long-form project
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
        "404":
          description: Long-form project not found
        "409":
          description: Active projects must be paused or cancelled before deletion
  /long-form-projects/{id}/start:
    post:
      operationId: startLongFormProject
      tags: [long-form-projects]
      summary: Start or resume a long-form project
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Active long-form project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LongFormProjectDetail"
  /long-form-projects/{id}/reassemble:
    post:
      operationId: reassembleLongFormProject
      tags: [long-form-projects]
      summary: Rebuild the final video from completed shot outputs
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Long-form project queued for assembly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LongFormProjectDetail"
        "409":
          description: Project cannot be reassembled from its current shot state
  /long-form-projects/{id}/pause:
    post:
      operationId: pauseLongFormProject
      tags: [long-form-projects]
      summary: Pause future dispatch for a long-form project
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Paused long-form project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LongFormProjectDetail"
  /long-form-projects/{id}/cancel:
    post:
      operationId: cancelLongFormProject
      tags: [long-form-projects]
      summary: Cancel a long-form project and active child renders
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Cancelled long-form project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LongFormProjectDetail"
  /long-form-projects/{id}/shots/{shotId}:
    patch:
      operationId: updateLongFormShot
      tags: [long-form-projects]
      summary: Edit a planned long-form shot
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: shotId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LongFormShotUpdate"
      responses:
        "200":
          description: Updated shot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LongFormShot"
  /long-form-projects/{id}/shots/{shotId}/retry:
    post:
      operationId: retryLongFormShot
      tags: [long-form-projects]
      summary: Retry a failed long-form shot
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: shotId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Queued shot retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LongFormShot"
  /long-form-projects/{id}/timeline:
    patch:
      operationId: updateLongFormTimeline
      tags: [long-form-projects]
      summary: Save the ordered trim decisions for a long-form project
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LongFormTimelineInput"
      responses:
        "200":
          description: Updated long-form timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LongFormProjectDetail"
        "409":
          description: Timeline cannot be changed while the project is active
  /long-form-projects/{id}/nle-package:
    get:
      operationId: downloadLongFormNlePackage
      tags: [long-form-projects]
      summary: Download source clips and an NLE edit package
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: ZIP archive containing source clips and edit decision lists
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "409":
          description: All clips must be completed before export
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Character:
      type: object
      required: [id, name, description, promptDescription, thumbnail, tags, assetCount, voiceProfile, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        promptDescription: { type: string }
        thumbnail: { type: ["string", "null"] }
        tags: { type: array, items: { type: string } }
        assetCount: { type: number }
        voiceProfile: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
    CharacterInput:
      type: object
      required: [name, description, promptDescription]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        promptDescription: { type: string }
        thumbnail: { type: ["string", "null"] }
        tags: { type: array, items: { type: string } }
        voiceProfile: { type: ["string", "null"] }
    Setting:
      type: object
      required: [id, name, description, promptDescription, thumbnail, tags, assetCount, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        promptDescription: { type: string }
        thumbnail: { type: ["string", "null"] }
        tags: { type: array, items: { type: string } }
        assetCount: { type: number }
        createdAt: { type: string }
        updatedAt: { type: string }
    SettingInput:
      type: object
      required: [name, description, promptDescription]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        promptDescription: { type: string }
        thumbnail: { type: ["string", "null"] }
        tags: { type: array, items: { type: string } }
    ComfyServer:
      type: object
      required: [id, displayName, hostname, gpuName, vramGb, tags, enabled, priority, status, queueSize, activeJobCount, lastHeartbeat, supportedWorkflowCount]
      properties:
        id: { type: string }
        displayName: { type: string }
        hostname: { type: string }
        gpuName: { type: ["string", "null"] }
        vramGb: { type: ["number", "null"] }
        tags: { type: array, items: { type: string } }
        enabled: { type: boolean }
        priority: { type: number }
        status: { type: string, enum: [ONLINE, OFFLINE, UNKNOWN] }
        queueSize: { type: number }
        activeJobCount: { type: number }
        lastHeartbeat: { type: ["string", "null"] }
        supportedWorkflowCount: { type: number }
        memoryUsedGb: { type: ["number", "null"] }
    ServerCreateInput:
      type: object
      required: [displayName, apiBaseUrl, websocketUrl, priority]
      properties:
        displayName: { type: string, minLength: 1 }
        apiBaseUrl: { type: string }
        websocketUrl: { type: string }
        gpuName: { type: ["string", "null"] }
        vramGb: { type: ["number", "null"] }
        tags: { type: array, items: { type: string } }
        enabled: { type: boolean, default: true }
        priority: { type: number, minimum: 0 }
        maxConcurrentJobs: { type: ["number", "null"], minimum: 1 }
    ServerUpdateInput:
      type: object
      properties:
        displayName: { type: string, minLength: 1 }
        apiBaseUrl: { type: string }
        websocketUrl: { type: string }
        gpuName: { type: ["string", "null"] }
        vramGb: { type: ["number", "null"] }
        tags: { type: array, items: { type: string } }
        enabled: { type: boolean }
        priority: { type: number, minimum: 0 }
        maxConcurrentJobs: { type: ["number", "null"], minimum: 1 }
    ServerConnectionConfiguration:
      type: object
      required: [id, apiBaseUrl, websocketUrl]
      properties:
        id: { type: string }
        apiBaseUrl: { type: string }
        websocketUrl: { type: string }
    ConnectionTest:
      type: object
      required: [connected, message, server, gpu, vramGb]
      properties:
        connected: { type: boolean }
        message: { type: string }
        server: { type: ["string", "null"] }
        gpu: { type: ["string", "null"] }
        vramGb: { type: ["number", "null"] }
    QueueSnapshot:
      type: object
      required: [queueRunning, queuePending]
      properties:
        queueRunning: { type: number }
        queuePending: { type: number }
        queueRunningIds: { type: array, items: { type: string } }
        queuePendingIds: { type: array, items: { type: string } }
    WorkflowNode:
      type: object
      required: [nodeId, classType, title, inputs]
      properties:
        nodeId: { type: string }
        classType: { type: string }
        title: { type: ["string", "null"] }
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowInputField"
    WorkflowInputField:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: {}
    ParameterMapping:
      type: object
      required: [nodeId, input]
      properties:
        nodeId: { type: string }
        input: { type: string }
    WorkflowTemplate:
      type: object
      required: [id, name, description, generationMode, modelFamily, compatibleServerTags, active, version, mappings, nodes, expectedInputs, expectedOutputs, importedAt, apiWorkflow]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        generationMode: { type: string }
        modelFamily: { type: string }
        apiWorkflow:
          type: [object, "null"]
          additionalProperties: true
        compatibleServerTags: { type: array, items: { type: string } }
        active: { type: boolean }
        version: { type: number }
        mappings:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ParameterMapping"
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowNode"
        expectedInputs: { type: array, items: { type: string } }
        expectedOutputs: { type: array, items: { type: string } }
        importedAt: { type: string }
    WorkflowInput:
      type: object
      required: [name, description, generationMode, modelFamily, apiWorkflow, compatibleServerTags]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        generationMode: { type: string }
        modelFamily: { type: string }
        apiWorkflow:
          type: object
          additionalProperties: true
        compatibleServerTags: { type: array, items: { type: string } }
        mappings:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ParameterMapping"
    WorkflowUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        generationMode: { type: string }
        modelFamily: { type: string }
        compatibleServerTags: { type: array, items: { type: string } }
        active: { type: boolean }
        apiWorkflow:
          type: object
          additionalProperties: true
        mappings:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ParameterMapping"
    GenerationInput:
      type: object
      required: [prompt, generationMode, durationSeconds, fps, width, height, qualityPreset, seedMode]
      properties:
        characterIds: { type: array, items: { type: string }, minItems: 1, maxItems: 9 }
        settingId: { type: string }
        prompt: { type: string, minLength: 1, maxLength: 10000 }
        negativePrompt: { type: string, maxLength: 5000 }
        cameraInstructions: { type: string, maxLength: 5000 }
        dialogue: { type: string, maxLength: 5000 }
        motionInstructions: { type: string, maxLength: 5000 }
        audioInstructions: { type: string, maxLength: 5000 }
        generationMode: { type: string }
