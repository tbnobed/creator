openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Portable application-owned authentication
  - name: tenants
    description: Tenant and membership operations
  - name: characters
    description: Character library
  - name: settings
    description: Setting library
  - name: servers
    description: ComfyUI server administration
  - name: workflows
    description: Workflow template administration
  - name: generations
    description: Video generation jobs
  - name: long-form-projects
    description: Long-form video planning and orchestration
  - name: image-studio
    description: Durable image generation jobs and asset library
paths:
  /auth/config:
    get:
      operationId: getAuthConfig
      tags: [auth]
      summary: Get public authentication settings
      responses:
        "200":
          description: Public authentication settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthRegistrationInput" }
      responses:
        "204":
          description: Account created and session started
        "400":
          description: Invalid registration
        "409":
          description: Email is already registered
        "403":
          description: Initial administrator email is not permitted
        "429":
          description: Too many attempts
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Start a session with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthLoginInput" }
      responses:
        "204":
          description: Session started
        "400":
          description: Invalid login request
        "401":
          description: Invalid credentials
        "429":
          description: Too many attempts
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Session ended
  /tenant-invitations/accept:
    post:
      operationId: acceptTenantInvitation
      tags: [tenants]
      summary: Accept a workspace invitation for the authenticated account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantInvitationAcceptanceInput" }
      responses:
        "200":
          description: Accepted invitation and active tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantSummary" }
        "400":
          description: Invalid or expired invitation
        "403":
          description: Invitation belongs to another account
  /generation-capabilities:
    get:
      operationId: getGenerationCapabilities
      tags: [generations]
      summary: List safe generation options available to the active tenant
      responses:
        "200":
          description: Sanitized active generation capabilities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GenerationCapability" }
  /session:
    get:
      operationId: getSession
      tags: [tenants]
      summary: Get the current local session
      responses:
        "200":
          description: Current user and active tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      summary: List accessible tenants
      responses:
        "200":
          description: Accessible tenants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TenantSummary" }
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Create and activate a tenant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantInput" }
      responses:
        "201":
          description: Created tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantSummary" }
  /tenants/{id}/activate:
    post:
      operationId: activateTenant
      tags: [tenants]
      summary: Activate an accessible tenant
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Active tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantSummary" }
  /tenants/{id}/members:
    get:
      operationId: listTenantMembers
      tags: [tenants]
      summary: List tenant members
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Tenant members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TenantMember" }
    post:
      operationId: addTenantMember
      tags: [tenants]
      summary: Create a recipient-confirmed workspace invitation
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantMemberInput" }
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantInvitation" }
  /tenants/{id}/members/{userId}:
    delete:
      operationId: deleteTenantMember
      tags: [tenants]
      summary: Remove a tenant member
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removed
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /characters:
    get:
      operationId: listCharacters
      tags: [characters]
      summary: List characters
      responses:
        "200":
          description: Character library
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Character"
    post:
      operationId: createCharacter
      tags: [characters]
      summary: Create a character
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterInput"
      responses:
        "201":
          description: Created character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
  /characters/{id}:
    patch:
      operationId: updateCharacter
      tags: [characters]
      summary: Update a character
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterInput"
      responses:
        "200":
          description: Updated character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
    delete:
      operationId: deleteCharacter
      tags: [characters]
      summary: Delete a character
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
  /characters/{id}/generate-image:
    post:
      operationId: generateCharacterImage
      tags: [characters]
      summary: Generate and attach a character reference image
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioImageGenerationInput"
      responses:
        "201":
          description: Generated character reference image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioImageGenerationResult"
  /characters/{id}/voice-sample:
    post:
      operationId: uploadCharacterVoiceSample
      tags: [characters]
      summary: Upload a consented character voice reference
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          audio/wav:
            schema: { type: string, format: binary }
          audio/mpeg:
            schema: { type: string, format: binary }
          audio/mp4:
            schema: { type: string, format: binary }
          audio/webm:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Normalized voice reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterVoiceSampleResult"
    delete:
      operationId: deleteCharacterVoiceSample
      tags: [characters]
      summary: Remove a character voice reference
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Voice reference removed
  /settings:
    get:
      operationId: listSettings
      tags: [settings]
      summary: List settings
      responses:
        "200":
          description: Setting library
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Setting"
    post:
      operationId: createSetting
      tags: [settings]
      summary: Create a setting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingInput"
      responses:
        "201":
          description: Created setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
  /settings/{id}:
    patch:
      operationId: updateSetting
      tags: [settings]
      summary: Update a setting
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingInput"
      responses:
        "200":
          description: Updated setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
    delete:
      operationId: deleteSetting
      tags: [settings]
      summary: Delete a setting
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
  /settings/{id}/generate-image:
    post:
      operationId: generateSettingImage
      tags: [settings]
      summary: Generate and attach a setting reference image
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioImageGenerationInput"
      responses:
        "201":
          description: Generated setting reference image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioImageGenerationResult"
  /servers:
    get:
      operationId: listServers
      tags: [servers]
      summary: List configured ComfyUI servers
      responses:
        "200":
          description: Server cards without private connection details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComfyServer"
    post:
      operationId: createServer
      tags: [servers]
      summary: Add a ComfyUI server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerCreateInput"
      responses:
        "201":
          description: Created server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComfyServer"
  /servers/{id}:
    patch:
      operationId: updateServer
      tags: [servers]
      summary: Update a ComfyUI server
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerUpdateInput"
      responses:
        "200":
          description: Updated server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComfyServer"
    delete:
      operationId: deleteServer
      tags: [servers]
      summary: Remove a server
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
  /servers/{id}/configuration:
    get:
      operationId: getServerConfiguration
      tags: [servers]
      summary: Read saved ComfyUI connection details for editing
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Editable ComfyUI connection configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerConnectionConfiguration"
  /servers/{id}/test:
    post:
      operationId: testServerConnection
      tags: [servers]
      summary: Test a configured server connection
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Connection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTest"
  /servers/{id}/queue:
    get:
      operationId: getServerQueue
      tags: [servers]
      summary: Read the queue for a configured server
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Queue snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueSnapshot"
  /workflows:
    get:
      operationId: listWorkflows
      tags: [workflows]
      summary: List workflow templates
      responses:
        "200":
          description: Workflow templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowTemplate"
    post:
      operationId: createWorkflow
      tags: [workflows]
      summary: Import an API-format workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowInput"
      responses:
        "201":
          description: Imported workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowTemplate"
  /workflows/{id}:
    get:
      operationId: getWorkflow
      tags: [workflows]
      summary: Inspect a workflow template
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Workflow with readable node inspection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowTemplate"
    patch:
      operationId: updateWorkflow
      tags: [workflows]
      summary: Update workflow metadata, API JSON, and mappings
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowUpdate"
      responses:
        "200":
          description: Updated workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowTemplate"
  /generations:
    get:
      operationId: listGenerations
      tags: [generations]
      summary: List generation history
      parameters:
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        "200":
          description: Paginated generation history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedGenerations"
    post:
      operationId: createGeneration
      tags: [generations]
      summary: Submit a generation job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerationInput"
      responses:
        "201":
          description: Queued generation job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"
  /generations/{id}:
    get:
      operationId: getGeneration
      tags: [generations]
      summary: Get a generation job
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Generation job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"
    delete:
      operationId: deleteGeneration
      tags: [generations]
      summary: Delete a completed generation from history
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
        "404":
          description: Generation not found
        "409":
          description: Active generations must be cancelled before deletion
  /generations/{id}/cancel:
    post:
      operationId: cancelGeneration
      tags: [generations]
      summary: Cancel an active generation job
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Cancelled generation job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"
  /reference-videos:
    get:
      operationId: listReferenceVideos
      tags: [media]
      summary: List previously uploaded reference videos
      responses:
        "200":
          description: Reference video library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceVideoList"
    post:
      operationId: uploadReferenceVideo
      tags: [media]
      summary: Upload a reference video for a generation
      requestBody:
        required: true
        content:
          video/mp4:
            schema:
              type: string
              format: binary
          video/webm:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Stored reference video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceVideoUpload"
  /reference-videos/{name}:
    delete:
      operationId: deleteReferenceVideo
      tags: [media]
      summary: Delete a previously uploaded reference video
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Reference video deleted
  /prompt-guidance/polish:
    post:
      operationId: polishPrompt
      tags: [generations]
      summary: Improve a video prompt while preserving creator intent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptPolishInput"
      responses:
        "200":
          description: Editable polished prompt fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptPolishResult"
  /prompt-guidance/check:
    post:
      operationId: checkPrompt
      tags: [generations]
      summary: Review the current video prompt with AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptPolishInput"
      responses:
        "200":
          description: AI prompt review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptCheckResult"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [generations]
      summary: Read studio summary data
      responses:
        "200":
          description: Summary for the studio shell
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /long-form-projects:
    get:
      operationId: listLongFormProjects
      tags: [long-form-projects]
      summary: List long-form video projects
      responses:
        "200":
          description: Long-form projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LongFormProject"
    post:
      operationId: createLongFormProject
      tags: [long-form-projects]
      summary: Create a planned long-form video project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LongFormProjectInput"
      responses:
        "201":
          description: Planned long-form project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LongFormProjectDetail"
  /long-form-projects/{id}:
    get:
      operationId: getLongFormProject
      tags: [long-form-projects]
      summary: Get a long-form project and its shot plan
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Long-form project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LongFormProjectDetail"
    delete:
      operationId: deleteLongFormProject
      tags: [long-form-projects]
      summary: Delete a non-active long-form project
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
        "404":
          description: Long-form project not found
        "409":
          description: Active projects must be paused or cancelled before deletion
  /long-form-projects/{id}/start:
    post:
      operationId: startLongFormProject
      tags: [long-form-projects]
      summary: Start or resume a long-form project
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Active long-form project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LongFormProjectDetail"
  /long-form-projects/{id}/reassemble:
    post:
      operationId: reassembleLongFormProject
      tags: [long-form-projects]
      summary: Rebuild the final video from completed shot outputs
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Long-form project queued for assembly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LongFormProjectDetail"
        "409":
          description: Project cannot be reassembled from its current shot state
  /long-form-projects/{id}/pause:
    post:
      operationId: pauseLongFormProject
      tags: [long-form-projects]
      summary: Pause future dispatch for a long-form project
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Paused long-form project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LongFormProjectDetail"
  /long-form-projects/{id}/cancel:
    post:
      operationId: cancelLongFormProject
      tags: [long-form-projects]
      summary: Cancel a long-form project and active child renders
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Cancelled long-form project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LongFormProjectDetail"
  /long-form-projects/{id}/shots/{shotId}:
    patch:
      operationId: updateLongFormShot
      tags: [long-form-projects]
      summary: Edit a planned long-form shot
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: shotId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LongFormShotUpdate"
      responses:
        "200":
          description: Updated shot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LongFormShot"
  /long-form-projects/{id}/shots/{shotId}/retry:
    post:
      operationId: retryLongFormShot
      tags: [long-form-projects]
      summary: Retry a failed long-form shot
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: shotId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Queued shot retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LongFormShot"
  /long-form-projects/{id}/timeline:
    patch:
      operationId: updateLongFormTimeline
      tags: [long-form-projects]
      summary: Save the ordered trim decisions for a long-form project
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LongFormTimelineInput"
      responses:
        "200":
          description: Updated long-form timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LongFormProjectDetail"
        "409":
          description: Timeline cannot be changed while the project is active
  /long-form-projects/{id}/nle-package:
    get:
      operationId: downloadLongFormNlePackage
      tags: [long-form-projects]
      summary: Download source clips and an NLE edit package
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: ZIP archive containing source clips and edit decision lists
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "409":
          description: All clips must be completed before export
  /image-studio/models:
    get:
      operationId: listImageStudioModels
      tags: [image-studio]
      summary: List image models and their current availability
      responses:
        "200":
          description: Image model catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageModelList" }
  /image-studio/jobs:
    get:
      operationId: listImageStudioJobs
      tags: [image-studio]
      summary: List the active tenant's newest image jobs
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: number, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Tenant-private image jobs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageJobList" }
    post:
      operationId: createImageStudioJob
      tags: [image-studio]
      summary: Submit a durable image task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageJobInput" }
      responses:
        "202":
          description: Accepted image task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageJobResult" }
        "400":
          description: Invalid task
        "402":
          description: Paid Cloud task needs explicit confirmation
        "409":
          description: No safe worker capacity
  /image-studio/jobs/{id}:
    get:
      operationId: getImageStudioJob
      tags: [image-studio]
      summary: Get a tenant-private image job
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Image job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageJobResult" }
        "404":
          description: Image job not found
    delete:
      operationId: deleteImageStudioJob
      tags: [image-studio]
      summary: Delete a non-active image job
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
        "404":
          description: Image job not found
        "409":
          description: Active image jobs must be cancelled before deletion
  /image-studio/jobs/{id}/cancel:
    post:
      operationId: cancelImageStudioJob
      tags: [image-studio]
      summary: Cancel an active image job
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Current image job after cancellation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageJobResult" }
        "404":
          description: Image job not found
  /image-studio/assets:
    get:
      operationId: listImageStudioAssets
      tags: [image-studio]
      summary: Search the active tenant's image assets
      parameters:
        - in: query
          name: search
          required: false
          schema: { type: string, maxLength: 200 }
        - in: query
          name: favorite
          required: false
          schema: { type: boolean }
        - in: query
          name: collection
          required: false
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Tenant-private image assets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageAssetList" }
  /image-studio/uploads:
    post:
      operationId: uploadImageStudioAsset
      tags: [image-studio]
      summary: Upload a PNG, JPEG, or WebP image
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Stored image asset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageAssetResult" }
        "400":
          description: Invalid image
        "413":
          description: Image is too large
  /image-studio/assets/{id}:
    patch:
      operationId: updateImageStudioAsset
      tags: [image-studio]
      summary: Update image asset library metadata
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageAssetUpdate" }
      responses:
        "200":
          description: Updated image asset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageAssetResult" }
        "404":
          description: Image asset not found
    delete:
      operationId: deleteImageStudioAsset
      tags: [image-studio]
      summary: Delete an unreferenced image asset
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
        "404":
          description: Image asset not found
        "409":
          description: Image asset is still referenced by a job
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    ImageOperation:
      type: string
      enum: [generate, edit, inpaint, outpaint, upscale, remove-background]
    ImageModel:
      type: object
      required: [id, name, provider, description, operations, aspectRatios, maxImages, supportsSeed, supportsNegativePrompt, maxReferences, priceNote, available]
      properties:
        id: { type: string }
        name: { type: string }
        provider: { type: string, enum: [LOCAL, CLOUD] }
        description: { type: string }
        operations:
          type: array
          items: { $ref: "#/components/schemas/ImageOperation" }
        aspectRatios: { type: array, items: { type: string } }
        maxImages: { type: number }
        supportsSeed: { type: boolean }
        supportsNegativePrompt: { type: boolean }
        maxReferences: { type: number }
        priceNote: { type: string }
        requiredTag: { type: string }
        available: { type: boolean }
        unavailableReason: { type: string }
    ImageModelList:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items: { $ref: "#/components/schemas/ImageModel" }
    ImageAsset:
      type: object
      required: [id, name, url, mimeType, width, height, favorite, collection, jobId, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
        storageKey: { type: string }
        mimeType: { type: string, enum: [image/png, image/jpeg, image/webp] }
        width: { type: number }
        height: { type: number }
        favorite: { type: boolean }
        collection: { type: string }
        jobId: { type: ["string", "null"] }
        createdAt: { type: string }
    ImageJob:
      type: object
      required: [id, modelId, modelName, provider, operation, prompt, width, height, count, status, errorMessage, assets, referenceAssetIds, maskAssetId, createdAt]
      properties:
        id: { type: string }
        modelId: { type: string }
        modelName: { type: string }
        provider: { type: string, enum: [LOCAL, CLOUD] }
        operation: { $ref: "#/components/schemas/ImageOperation" }
        prompt: { type: string }
        negativePrompt: { type: string }
        width: { type: number }
        height: { type: number }
        count: { type: number }
        seed: { type: number }
        status: { type: string, enum: [QUEUED, RUNNING, COMPLETED, FAILED, CANCELLED] }
        errorMessage: { type: ["string", "null"] }
        assets:
          type: array
          items: { $ref: "#/components/schemas/ImageAsset" }
        referenceAssetIds: { type: array, items: { type: string } }
        maskAssetId: { type: ["string", "null"] }
        createdAt: { type: string }
    ImageJobInput:
      type: object
      required: [modelId, operation, prompt, width, height, count]
      properties:
        modelId: { type: string, minLength: 1, maxLength: 200 }
        operation: { $ref: "#/components/schemas/ImageOperation" }
        prompt: { type: string, maxLength: 10000 }
        negativePrompt: { type: string, maxLength: 5000 }
        width: { type: number, minimum: 1, maximum: 32768 }
        height: { type: number, minimum: 1, maximum: 32768 }
        count: { type: number, minimum: 1, maximum: 16 }
        seed: { type: number, minimum: 0, maximum: 2147483647 }
        referenceAssetIds:
          type: array
          maxItems: 16
          items: { type: string }
        maskAssetId: { type: string }
        cloudConfirmed: { type: boolean }
        requestKey: { type: string, minLength: 36, maxLength: 36 }
    ImageAssetUpdate:
      type: object
      properties:
        favorite: { type: boolean }
        collection: { type: string, maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 255 }
    ImageJobList:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items: { $ref: "#/components/schemas/ImageJob" }
    ImageJobResult:
      type: object
      required: [job]
      properties:
        job: { $ref: "#/components/schemas/ImageJob" }
    ImageAssetList:
      type: object
      required: [assets]
      properties:
        assets:
          type: array
          items: { $ref: "#/components/schemas/ImageAsset" }
    ImageAssetResult:
      type: object
      required: [asset]
      properties:
        asset: { $ref: "#/components/schemas/ImageAsset" }
    AuthConfig:
      type: object
      required: [registrationEnabled, bootstrapAvailable]
      properties:
        registrationEnabled: { type: boolean }
        bootstrapAvailable: { type: boolean }
    AuthLoginInput:
      type: object
      required: [email, password]
